<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="brand" aria-hidden="true">가<span>A</span></div>
      <div class="copy">
        <h1>Drag Translate</h1>
        <p id="statusText">이 PDF를 번역 가능한 전용 뷰어에서 엽니다.</p>
      </div>
      <button id="openPdfViewer" type="button">번역 PDF 뷰어로 열기</button>
      <p class="hint">뷰어가 열리면 영어 문장을 드래그하세요.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
